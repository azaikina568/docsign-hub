services:
  backend:
    build:
      context: ./infra/docker/php
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      # Диаграммы /docs/diagrams и JSON Schema контрактов читаются из корневых docs/ и contracts/,
      # проброшенных ниже (они вне ./backend, поэтому отдельными томами).
      DOCSIGN_DIAGRAMS_PATH: /srv/docs/diagrams.md
      DOCSIGN_CONTRACTS_PATH: /srv/contracts/events/v1
    volumes:
      - ./backend:/var/www/html
      - ./docs:/srv/docs:ro
      - ./contracts:/srv/contracts:ro
    command: sh -c "composer install && php-fpm"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      mailpit:
        condition: service_started

  # Планировщик Laravel: отдельный долгоживущий процесс schedule:work.
  # В проде держим ровно один инстанс (иначе задачи задвоятся); сам код задач
  # дополнительно прикрыт onOneServer() через Redis-lock.
  scheduler:
    build:
      context: ./infra/docker/php
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
    # Ждём, пока backend поставит зависимости в общий том, и запускаем планировщик.
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan schedule:work"
    # Перезапуск, если процесс упадёт (минимальная супервизия; прод-grade — см. SCALING_PERFORMANCE).
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Воркер очереди Laravel: фоновые задачи приложения (письмо подтверждения email и т.п.),
  # чтобы они не блокировали HTTP-запрос. Доменные события идут отдельным каналом (RabbitMQ/outbox).
  queue-worker:
    build:
      context: ./infra/docker/php
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan queue:work --tries=3 --max-time=3600"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Воркер-публишер: вычитывает outbox и шлёт события в RabbitMQ (transactional outbox).
  publisher:
    build:
      context: ./infra/docker/php
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
    # Ждём установку зависимостей, объявляем топологию, затем крутим демон.
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan messaging:setup && php artisan outbox:publish --daemon"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Consumer уведомлений: события RabbitMQ → письма (приглашения по очереди, уведомление об истечении).
  consumer-notifications:
    build:
      context: ./infra/docker/php
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan messaging:consume notifications"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Audit-consumer: события RabbitMQ → неизменяемый журнал в MongoDB (audit_events).
  consumer-audit:
    build:
      context: ./infra/docker/php
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan messaging:consume audit"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      # Bind-mount на Windows не отдаёт file-события → Vite HMR без polling не видит правок (нужен рестарт).
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - nginx

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-docsign_hub}
      POSTGRES_USER: ${DB_USERNAME:-docsign}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docsign}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docsign} -d ${DB_DATABASE:-docsign_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-docsign}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-docsign}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: docsign
      MONGO_INITDB_ROOT_PASSWORD: docsign
      MONGO_INITDB_DATABASE: docsign_hub
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
  frontend_node_modules:
