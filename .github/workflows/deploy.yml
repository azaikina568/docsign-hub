name: Deploy

# Деплой — по тегу-релизу (v1.2.3) или вручную из вкладки Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Публикуем рантайм-образ в GitHub Container Registry (ghcr.io). Работает «из коробки»
  # на репозитории-владельце через GITHUB_TOKEN — дополнительных секретов не нужно.
  publish-image:
    name: Publish runtime image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./infra/docker/php
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Шаблон серверного деплоя. По умолчанию выключен: включается переменной репозитория
  # DEPLOY_ENABLED=true + секретами SSH (см. plans/CI_SETUP.md). Сервер сам тянет код и
  # пересобирает compose-стек; прод-секреты (APP_KEY, БД) живут в .env НА сервере, не в CI.
  deploy-server:
    name: Deploy to server (SSH)
    needs: publish-image
    runs-on: ubuntu-latest
    environment: production
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose up -d --build
            docker compose exec -T backend php artisan migrate --force
