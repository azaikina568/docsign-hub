name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Только последний прогон на ветку — ранние отменяем (экономия раннеров).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Расширения PHP = рантайм-таргет (Docker-образ): mongodb/sockets нужны уже для composer install
# (их требует mongodb/mongodb), pdo_sqlite/sqlite3 — для тестов на sqlite :memory:.
env:
  PHP_EXTENSIONS: intl, pcntl, sockets, pdo_pgsql, pdo_sqlite, sqlite3, mongodb, redis, zip, bcmath

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: backend

      # Тесты форсят sqlite/array в tests/bootstrap.php, но Pint/PHPStan бутят контейнер → нужен APP_KEY.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: php artisan test

      # Сигнальный (не блокирующий) аудит зависимостей — advisories видны, но не валят чистый клон.
      - name: Dependency audit
        run: composer audit --no-interaction
        continue-on-error: true

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev
        continue-on-error: true

  # Тесты идут на sqlite; этот job отдельно доказывает, что миграции и сидеры применяются
  # к реальному PostgreSQL (тип колонок, ULID-бэкофилл, FK) — то, что sqlite не ловит.
  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: docsign_hub
          POSTGRES_USER: docsign
          POSTGRES_PASSWORD: docsign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docsign -d docsign_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: docsign_hub
      DB_USERNAME: docsign
      DB_PASSWORD: docsign
      # Сидер ходит через доменные Actions, но без брокеров: события пишутся только в outbox-таблицу.
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: backend

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed (fresh schema on Postgres)
        run: php artisan migrate:fresh --seed --force

      - name: Verify idempotent re-run
        run: php artisan migrate:status

  # Сборка рантайм-образа: на раннере локального кэша нет (чистая сборка), но слои берём из
  # GitHub Actions cache → быстро. Доказывает, что Dockerfile собирается из чистого состояния.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./infra/docker/php
          push: false
          tags: docsign-hub/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
