name: signing-worker

# Отдельный workflow с path-фильтром: гоняется только при изменениях Go-сервиса (а не на каждый PR ядра).
on:
  push:
    branches: [main]
    paths: ['services/signing-worker/**', '.github/workflows/signing-worker.yml']
  pull_request:
    branches: [main]
    paths: ['services/signing-worker/**', '.github/workflows/signing-worker.yml']

concurrency:
  group: signing-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (signing-worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signing-worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: services/signing-worker/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      # Линт тем же образом, что валидируется локально — без привязки к версии стороннего action.
      - name: Lint (golangci-lint)
        run: docker run --rm -v "$PWD":/src -w /src golangci/golangci-lint:v2.12.2 golangci-lint run ./...
