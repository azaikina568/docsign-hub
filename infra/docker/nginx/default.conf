server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Резолвим backend через встроенный DNS Docker на каждый запрос (имя в переменной + resolver),
        # иначе nginx кэширует IP с момента старта и после пересоздания backend (up --build) отдаёт 502,
        # пока его не перезапустишь вручную.
        resolver 127.0.0.11 valid=10s;
        set $upstream backend:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
